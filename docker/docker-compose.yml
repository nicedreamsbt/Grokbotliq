services:
  liquidator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../config/example.env
    environment:
      DRY_RUN: "true"
      LIQ_CONFIG: /config/example.toml
      LIQ_FIXTURES: /fixtures
    restart: unless-stopped
    # Uncomment to run shadow against fixtures instead:
    # command: ["shadow", "/fixtures"]
